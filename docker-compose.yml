version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: screenbox_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: screenbox_db
      MYSQL_USER: screenbox_user
      MYSQL_PASSWORD: screenbox_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: screenbox_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://screenbox_user:screenbox_password@mysql:3306/screenbox_db"
      JWT_SECRET: "production_secret_change_me_in_real_deployment"
      CLIENT_URL: "http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: screenbox_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
